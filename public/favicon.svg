<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F3826" />
      <stop offset="70%" stop-color="#071C13" />
      <stop offset="100%" stop-color="#04120C" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#C7A35A" />
      <stop offset="40%" stop-color="#E5C989" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F9E8B2" />
    </linearGradient>
    <linearGradient id="leafInnerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D2F20" />
      <stop offset="60%" stop-color="#184E36" />
      <stop offset="100%" stop-color="#2D7A56" />
    </linearGradient>
    <linearGradient id="veinGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7A35A" />
      <stop offset="100%" stop-color="#FDF2D0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Green Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#C7A35A" stroke-width="4" stroke-opacity="0.3" />

  <!-- Botanical Leaf Motif (Central and Prominent for ultra-clear visibility at 16x16 / 32x32) -->
  <g filter="url(#glow)">
    <!-- Main Leaf Body -->
    <path d="M140 372 C 140 230, 220 130, 372 110 C 372 260, 290 372, 140 372 Z" 
          fill="url(#leafInnerGrad)" 
          stroke="url(#leafGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />
    
    <!-- Central Main Vein Spine -->
    <path d="M140 372 C 200 310, 270 230, 372 110" 
          stroke="url(#veinGold)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Lateral Delicate Herbal Veins -->
    <path d="M220 290 C 190 250, 175 220, 168 195" 
          stroke="url(#veinGold)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-opacity="0.85" />
    
    <path d="M265 240 C 300 255, 330 275, 345 300" 
          stroke="url(#veinGold)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-opacity="0.85" />

    <path d="M295 200 C 265 170, 240 145, 225 130" 
          stroke="url(#veinGold)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-opacity="0.85" />

    <!-- Golden Dewdrop / Essence of Infusion Sparkle -->
    <circle cx="340" cy="145" r="10" fill="#FDF2D0" />
  </g>
</svg>